services:

  # =========================================================
  # DEV CONTAINER
  # =========================================================

  app:
    build:
      context: .
      dockerfile: Dockerfile

    volumes:
      - ..:/workspaces/zomato-ai-data-engineering-end-to-end-project:cached

    command: sleep infinity

    depends_on:
      - minio

    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin


  # =========================================================
  # MINIO
  # =========================================================

  minio:
    image: minio/minio:latest

    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio-data:/data


  # =========================================================
  # AIRFLOW DATABASE
  # =========================================================

  postgres:
    image: postgres:15

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5


  # =========================================================
  # AIRFLOW COMMON CONFIGURATION
  # =========================================================

  airflow-init:
    build:
      context: ../airflow
      dockerfile: Dockerfile

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__API__BASE_URL: "https://${CODESPACE_NAME}-8080.${GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN}"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://airflow:airflow@postgres/airflow

      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      AIRFLOW__CORE__AUTH_MANAGER: >-
        airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager

      AIRFLOW__CORE__FERNET_KEY: ""

      AIRFLOW__API_AUTH__JWT_SECRET: "change-me-please-random-secret"

      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: >-
        http://apiserver:8080/execution/

      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin

      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT}
      SNOWFLAKE_USER: ${SNOWFLAKE_USER}
      SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD}

      AIRFLOW_CONN_SNOWFLAKE_DEFAULT: >-
        {"conn_type":"snowflake",
        "login":"${SNOWFLAKE_USER}",
        "password":"${SNOWFLAKE_PASSWORD}",
        "schema":"RAW",
        "extra":{
          "account":"${SNOWFLAKE_ACCOUNT}",
          "warehouse":"ZOMATO_WH",
          "database":"ZOMATO",
          "role":"DBT_ROLE"
        }}

    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - ../logs/airflow:/opt/airflow/logs
      - ../zomato:/opt/airflow/dbt/zomato
      - ../scripts:/opt/airflow/scripts

    depends_on:
      postgres:
        condition: service_healthy

    entrypoint: /bin/bash

    command:
      - -c
      - >
        airflow db migrate &&
        airflow users create
        --username admin
        --password admin
        --firstname admin
        --lastname admin
        --role Admin
        --email admin@example.com


  # =========================================================
  # AIRFLOW API SERVER
  # =========================================================

  apiserver:
    build:
      context: ../airflow
      dockerfile: Dockerfile

    environment: &airflow-env
      AIRFLOW__API__BASE_URL: "https://${CODESPACE_NAME}-8080.${GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN}"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://airflow:airflow@postgres/airflow

      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      AIRFLOW__CORE__AUTH_MANAGER: >-
        airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager

      AIRFLOW__CORE__FERNET_KEY: ""

      AIRFLOW__API_AUTH__JWT_SECRET: "change-me-please-random-secret"

      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: >-
        http://apiserver:8080/execution/

      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin

      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT}
      SNOWFLAKE_USER: ${SNOWFLAKE_USER}
      SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD}

    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - ../logs/airflow:/opt/airflow/logs
      - ../zomato:/opt/airflow/dbt/zomato
      - ../scripts:/opt/airflow/scripts

    ports:
      - "8080:8080"

    command: api-server

    depends_on:
      airflow-init:
        condition: service_completed_successfully


  # =========================================================
  # AIRFLOW SCHEDULER
  # =========================================================

  scheduler:
    build:
      context: ../airflow
      dockerfile: Dockerfile

    environment:
      <<: *airflow-env
      AIRFLOW__API__BASE_URL: "https://${CODESPACE_NAME}-8080.${GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN}"
    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - ../logs/airflow:/opt/airflow/logs
      - ../zomato:/opt/airflow/dbt/zomato
      - ../scripts:/opt/airflow/scripts
      - ~/.dbt:/home/airflow/.dbt

    command: scheduler

    depends_on:
      airflow-init:
        condition: service_completed_successfully


  # =========================================================
  # AIRFLOW DAG PROCESSOR
  # =========================================================

  dag-processor:
    build:
      context: ../airflow
      dockerfile: Dockerfile

    environment:
      <<: *airflow-env
      AIRFLOW__API__BASE_URL: "https://${CODESPACE_NAME}-8080.${GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN}"
    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - ../logs/airflow:/opt/airflow/logs
      - ../zomato:/opt/airflow/dbt/zomato
      - ../scripts:/opt/airflow/scripts
      - ~/.dbt:/home/airflow/.dbt

    command: dag-processor

    depends_on:
      airflow-init:
        condition: service_completed_successfully


volumes:

  minio-data:

  pgdata: